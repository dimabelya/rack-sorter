<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef1f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12171b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Blocks every network request: only this page's own files can load.
       Nothing you paste can leave this device. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' file:; script-src 'self' file:; base-uri 'none'; form-action 'none'">
  <title>Rack Line Sorter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="wrap">

  <header>
    <h1>Rack Line Sorter</h1>
    <p class="sub">Paste a list, pick the column to group by, then work through it group by group.</p>
  </header>

  <section>
    <label class="label" for="text">1 &middot; Paste lines</label>
    <textarea id="text" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
    <div class="row">
      <button id="clear" type="button">Clear</button>
      <button id="example" type="button">Load example</button>
      <span class="hint">Columns are split on spaces. Blank lines are ignored.</span>
    </div>
  </section>

  <section>
    <span class="label" id="groupByLabel">2 &middot; Group by column</span>
    <div class="chips" id="fields" role="group" aria-labelledby="groupByLabel"></div>
    <div class="row">
      <label class="hint" for="sortBy">Then sort inside each group by</label>
      <select id="sortBy"></select>
    </div>
  </section>

  <section>
    <label class="label" for="filter">3 &middot; Filter groups</label>
    <input id="filter" type="text" placeholder="e.g. f09" autocapitalize="off" autocomplete="off" spellcheck="false">
    <span class="hint">Shows only groups whose name contains this text.</span>
  </section>

  <section>
    <div class="row toolbar">
      <div class="summary" id="summary"></div>
      <div class="row">
        <div class="hl" id="hl">
          <button id="hlButton" type="button" class="hl-button"
                  aria-haspopup="true" aria-expanded="false">
            <span class="hl-mark" aria-hidden="true"></span>
            <span id="hlLabel">Highlight</span>
          </button>
          <div class="hl-palette" id="hlPalette" role="group" aria-label="Highlighter colour" hidden></div>
        </div>
        <button id="uncheck" type="button">Uncheck all</button>
        <button id="copy" type="button" class="primary">Copy grouped</button>
      </div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <nav class="jump" id="jump" aria-label="Jump to a group"></nav>
  </section>

  <div class="groups" id="groups"></div>

</main>

<script src="app.js"></script>
</body>
</html>
